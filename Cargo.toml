[package]
name = "avr-thermostat"
version = "0.1.0"
authors = ["kwantam <kwantam@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "avr-thermostat"
test = false
bench = false

[dependencies]
panic-halt = "1.0.0"
ufmt = "0.2.0"

arduino-hal = { git = "https://github.com/rahix/avr-hal", rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2", features = ["arduino-nano"] }
avr-hal-generic = { git = "https://github.com/rahix/avr-hal", rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2" }

avr-device = "0.8.1"

one-wire-bus = { git = "https://github.com/kwantam/one-wire-bus-rs", branch = "master" }

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
